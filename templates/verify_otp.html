{% extends "base.html" %}

{% block title %}

OTP Verification

{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3 class="text-center">

Verify OTP

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-4">

<label>

Enter OTP

</label>

<input
type="text"
name="otp"
maxlength="6"
class="form-control text-center"
required>

</div>

<div class="d-grid">

<button
class="btn btn-primary">

Verify OTP

</button>

</div>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
