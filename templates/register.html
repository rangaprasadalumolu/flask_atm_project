{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-success text-white text-center">

                    <h3>Create New Account</h3>

                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Account Number
                            </label>

                            <input
                                type="text"
                                name="account_no"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                PIN
                            </label>

                            <input
                                type="password"
                                name="pin"
                                maxlength="4"
                                minlength="4"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Confirm PIN
                            </label>

                            <input
                                type="password"
                                name="confirm_pin"
                                maxlength="4"
                                minlength="4"
                                class="form-control"
                                required>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-success btn-lg">

                                Register

                            </button>

                        </div>

                    </form>

                </div>

                <div class="card-footer text-center">

                    Already have an account?

                    <a href="{{ url_for('login') }}">

                        Login Here

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
