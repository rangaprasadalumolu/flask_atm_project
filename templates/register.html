<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Register</title>

    <style>

    body{
        font-family:Arial;
        background:#0f4c81;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        background:white;
        width:400px;
        padding:30px;
        border-radius:10px;
        text-align:center;
    }

    input{
        width:90%;
        padding:10px;
        margin:8px;
    }

    button{
        width:95%;
        padding:10px;
        background:#0f4c81;
        color:white;
        border:none;
    }

    .msg{
        color:red;
        margin-top:10px;
    }

    </style>

</head>

<body>

<div class="container">

<h2>Create ATM Account</h2>

<form method="POST">

<input type="text"
       name="name"
       placeholder="Full Name"
       required>

<input type="email"
       name="email"
       placeholder="Email"
       required>

<input type="text"
       name="phone"
       placeholder="Mobile Number"
       required>

<input type="text"
       name="account_no"
       placeholder="Account Number"
       required>

<input type="password"
       name="pin"
       placeholder="4 Digit PIN"
       maxlength="4"
       required>

<button type="submit">
Register
</button>

</form>

<div class="msg">
{{ message }}
</div>

<br>

<a href="/">
Back to Home
</a>

</div>

</body>
</html>
