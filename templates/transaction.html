<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>

<th>Date</th>
<th>Type</th>
<th>Amount</th>
<th>Balance</th>

</tr>

</thead>

<tbody>

{% for t in transactions %}

<tr>

<td>{{ t[0] }}</td>
<td>{{ t[1] }}</td>
<td>₹{{ t[2] }}</td>
<td>₹{{ t[3] }}</td>

</tr>

{% endfor %}

</tbody>

</table>
