{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="text-center">
                    Verify PIN
                </h3>

                <p class="text-center text-muted">
                    Enter your PIN to confirm withdrawal
                </p>

                <form method="post">

                    <label>PIN</label>

                    <input
                    type="password"
                    name="pin"
                    maxlength="4"
                    pattern="[0-9]{4}"
                    class="form-control"
                    placeholder="Enter 4 Digit PIN"
                    required>

                    <br>

                    <button
                    type="submit"
                    class="btn btn-warning w-100">
                    Confirm Withdrawal
                    </button>

                </form>

                <br>

                <p class="text-danger text-center">
                    {{ msg }}
                </p>

                <div class="text-center">
                    <a href="/dashboard"
                    class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
