{% extends 'base.html' %}

{% block content %}

<div class="card shadow p-4">

<h3>
Reset PIN
</h3>

<form method="post">

<input
type="password"
name="new_pin"
maxlength="4"
class="form-control"
placeholder="New PIN">

<br>

<button
class="btn btn-primary">
Update PIN
</button>

</form>

<p class="text-danger">
{{ msg }}
</p>

</div>

{% endblock %}
