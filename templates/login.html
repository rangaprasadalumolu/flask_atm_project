{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card shadow">

<div class="card-body">

<h3 class="text-center">
ATM Login
</h3>

<form action="/login" method="post">

<label>
Account Number
</label>

<input
type="text"
name="account_no"
class="form-control"
required>

<br>

<label>
PIN
</label>

<input
type="password"
name="pin"
class="form-control"
maxlength="4"
required>

<br>

<button
class="btn btn-primary w-100">
Login
</button>
<a href="/forgot_pin">
Forgot PIN?
</a>

</form>

<p class="text-danger mt-3">
{{msg}}
</p>

</div>

</div>

</div>

</div>

{% endblock %}
