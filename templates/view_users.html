{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
All Users
</h2>

<div class="card shadow">

<div class="card-body">

<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Account Number</th>
<th>Name</th>
<th>Email</th>
<th>Balance</th>
<th>Action</th>

</tr>

</thead>

<tbody>

{% for user in users %}

<tr>

<td>{{ user.id }}</td>

<td>{{ user.account_no }}</td>

<td>{{ user.name }}</td>

<td>{{ user.email }}</td>

<td>₹ {{ user.balance }}</td>

<td>

<a
href="/delete_user/{{ user.id }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete User?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

<br>

<a href="/admin_dashboard"
class="btn btn-primary">
Back
</a>

{% endblock %}
