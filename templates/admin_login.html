{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-lg-5">

<div class="card shadow-lg">

<div class="card-header bg-dark text-white text-center">

<h2>

<i class="bi bi-shield-lock-fill"></i>

Admin Login

</h2>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-4">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="d-grid">

<button
class="btn btn-dark">

Login

</button>

</div>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
