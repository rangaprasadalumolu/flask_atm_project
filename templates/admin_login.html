{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center">
                        Admin Login
                    </h3>

                    <form method="post">

                        <input
                        type="text"
                        name="username"
                        placeholder="Username"
                        class="form-control"
                        required>

                        <br>

                        <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        class="form-control"
                        required>

                        <br>

                        <button
                        class="btn btn-dark w-100">
                        Login
                        </button>

                    </form>

                    <p class="text-danger mt-2">
                        {{ msg }}
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
