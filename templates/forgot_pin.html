{% extends "base.html" %}

{% block title %}Forgot PIN{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3 class="text-center">

Forgot PIN

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>

Account Number

</label>

<input
type="text"
name="account_no"
class="form-control"
required>

</div>

<div class="mb-4">

<label>

Registered Email

</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="d-grid">

<button
class="btn btn-warning">

Send OTP

</button>

</div>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
