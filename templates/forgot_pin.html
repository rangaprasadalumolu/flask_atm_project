{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card shadow">

<div class="card-body">

<h3 class="text-center">
Forgot PIN
</h3>

<form method="post">

<input
type="text"
name="account_no"
placeholder="Account Number"
class="form-control"
required>

<br>

<input
type="email"
name="email"
placeholder="Registered Email"
class="form-control"
required>

<br>

<button
class="btn btn-primary w-100">
Send OTP
</button>

</form>

<p class="text-danger mt-2">
{{ msg }}
</p>

</div>

</div>

</div>

</div>

{% endblock %}
