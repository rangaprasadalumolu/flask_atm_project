<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Deposit Money</title>

<style>
body{
font-family:Arial;
background:#0f4c81;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:400px;
border-radius:10px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
width:95%;
padding:10px;
background:#0f4c81;
color:white;
border:none;
}

.msg{
color:green;
}
</style>

</head>

<body>

<div class="container">

<h2>Deposit Money</h2>

<form action="/deposit" method="POST">

<input
type="number"
name="amount"
placeholder="Enter Amount"
min="1"
required>

<button type="submit">
Continue
</button>

</form>

<div class="msg">
{{ message }}
</div>

<br>

<a href="/dashboard">Back</a>

</div>

</body>
</html>
