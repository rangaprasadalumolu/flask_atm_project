<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login</title>

    <style>

    body{
        font-family:Arial;
        background:#0f4c81;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        background:white;
        width:400px;
        padding:30px;
        border-radius:10px;
        text-align:center;
    }

    input{
        width:90%;
        padding:10px;
        margin:10px;
    }

    button{
        width:95%;
        padding:10px;
        background:#0f4c81;
        color:white;
        border:none;
    }

    .msg{
        color:red;
    }

    </style>

</head>

<body>

<div class="container">

<h2>Enter Account Number</h2>

<form method="POST">

<input
type="text"
name="account_no"
placeholder="Enter Account Number"
required>

<button type="submit">
Verify
</button>

</form>

<div class="msg">
{{ message }}
</div>

</div>

</body>
</html>
