<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Confirm Withdrawal</title>

<style>

body{
font-family:Arial;
background:#0f4c81;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:400px;
border-radius:10px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
width:95%;
padding:10px;
background:#0f4c81;
color:white;
border:none;
}

</style>

</head>

<body>

<div class="container">

<h2>Enter ATM PIN</h2>

<form action="/confirm_withdraw" method="POST">

<input
type="password"
name="pin"
maxlength="4"
placeholder="Enter PIN"
required>

<button type="submit">
Withdraw
</button>

</form>

</div>

</body>
</html>
