<!DOCTYPE html>
<html>

<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>OTP Verification</title>

<style>

body{
font-family:Arial;
background:#0f4c81;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:400px;
border-radius:10px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
width:95%;
padding:10px;
background:#0f4c81;
color:white;
border:none;
}

.msg{
color:red;
}

.success{
color:green;
}

</style>

</head>

<body>

<div class="container">

<h2>OTP Verification</h2>

<p>Check your email for OTP</p>

<form action="/verify_otp" method="POST">

<input
type="text"
name="otp"
placeholder="Enter OTP"
required>

<button type="submit">
Verify OTP
</button>

</form>

<div class="msg">
{{ message }}
</div>

</div>

</body>

</html>
