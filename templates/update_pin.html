<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Update PIN</title>

<style>

body{
font-family:Arial;
background:#0f4c81;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:400px;
border-radius:10px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
width:95%;
padding:10px;
background:#0f4c81;
color:white;
border:none;
}

.msg{
color:red;
margin-top:10px;
}

.success{
color:green;
margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<h2>Update ATM PIN</h2>

<form action="/update_pin" method="POST">

<input
type="password"
name="old_pin"
placeholder="Current PIN"
maxlength="4"
required>

<input
type="password"
name="new_pin"
placeholder="New PIN"
maxlength="4"
required>

<input
type="password"
name="confirm_pin"
placeholder="Confirm New PIN"
maxlength="4"
required>

<button type="submit">
Update PIN
</button>

</form>

<div class="msg">
{{ message }}
</div>

<br>

<a href="/dashboard">
Back To Dashboard
</a>

</div>

</body>
</html>
