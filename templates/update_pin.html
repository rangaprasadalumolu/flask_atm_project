{% extends "base.html" %}

{% block title %}

Change PIN

{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-header bg-info text-white">

<h3 class="text-center">

Change PIN

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>

Current PIN

</label>

<input
type="password"
name="current_pin"
maxlength="4"
class="form-control"
required>

</div>

<div class="mb-3">

<label>

New PIN

</label>

<input
type="password"
name="new_pin"
maxlength="4"
class="form-control"
required>

</div>

<div class="mb-4">

<label>

Confirm New PIN

</label>

<input
type="password"
name="confirm_pin"
maxlength="4"
class="form-control"
required>

</div>

<div class="d-grid">

<button
class="btn btn-info text-white">

Update PIN

</button>

</div>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
